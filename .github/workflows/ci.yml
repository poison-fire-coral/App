# 체크리스트 27번 — PR마다 앱과 서버가 여전히 컴파일되고 테스트가 도는지 본다.

name: CI

on:
  pull_request:
    branches: [ main, develop, master ]
  push:
    branches: [ main, develop, master ]

# 같은 브랜치에 연달아 푸시하면 앞의 실행을 취소합니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Frontend (Flutter) CI
  app:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 로컬 개발 환경과 동일한 버전으로 고정
          flutter-version: 3.24.0
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # analysis_options.yaml 의 규칙 위반 검사
      - run: flutter analyze

      # 단위 테스트 및 위젯 테스트 실행
      - run: flutter test --reporter=compact

  # 2. Backend (Node.js / Express) CI
  server:
    name: Node (typecheck & build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Prisma client 생성 및 TypeScript 컴파일 검사
      # CI에 실 DB를 띄우지 않으므로 prisma generate용 가짜 DATABASE_URL 주입
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public