# 체크리스트 33번 — 런처 아이콘 생성 설정.
#
#   flutter test tool/generate_app_icon.dart      # 로고 SVG -> PNG 원본
#   dart run flutter_launcher_icons               # 원본 -> 각 밀도별 아이콘
#
# 두 단계를 나눈 이유: 원본 PNG는 로고가 바뀔 때만 다시 굽고, 밀도 변환은
# 그 원본만 있으면 언제든 다시 돌릴 수 있다.

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"

  # 적응형 아이콘 — 안드로이드 8 이상은 런처가 모양(원·사각·물방울)을 정하고
  # 앞면을 그 모양으로 잘라 낸다. 배경을 브랜드 바탕색으로 깔고, 앞면은
  # 안전 여백을 둔 별도 PNG를 쓴다. 같은 파일을 쓰면 인장이 잘린다.
  adaptive_icon_background: "#FBF6F3"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"

  # iOS는 투명도를 허용하지 않는다. 원본에 이미 바탕이 칠해져 있지만
  # 혹시 모를 알파를 여기서 한 번 더 없앤다.
  remove_alpha_ios: true
