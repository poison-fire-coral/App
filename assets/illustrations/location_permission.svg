<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140">
  <!-- 위치 권한 안내 · 지도 + 마커 (디자인 시스템 v1.0 · 10 지도) -->
  <defs>
    <linearGradient id="lpMap" x1="100" y1="10" x2="100" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F2EE"/><stop offset="1" stop-color="#EDE5DF"/>
    </linearGradient>
    <linearGradient id="lpBlock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0E6E0"/>
    </linearGradient>
    <linearGradient id="lpPin" x1="100" y1="38" x2="100" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B03526"/><stop offset="1" stop-color="#8A2419"/>
    </linearGradient>
  </defs>

  <!-- 지도 바닥 -->
  <rect x="10" y="10" width="180" height="120" rx="16" fill="url(#lpMap)"/>

  <!-- 도로 (ink200) -->
  <g stroke="#E1D6CF" stroke-linecap="round" fill="none">
    <path d="M10 52h180" stroke-width="9"/>
    <path d="M10 96h180" stroke-width="7"/>
    <path d="M62 10v120" stroke-width="9"/>
    <path d="M140 10v120" stroke-width="7"/>
  </g>
  <g stroke="#FBF7F4" stroke-linecap="round" fill="none" stroke-width="1.6" stroke-dasharray="7 7">
    <path d="M10 52h180"/><path d="M62 10v120"/>
  </g>

  <!-- 블록 -->
  <g fill="url(#lpBlock)">
    <rect x="22" y="20" width="30" height="22" rx="5"/>
    <rect x="150" y="62" width="30" height="24" rx="5"/>
    <rect x="22" y="104" width="30" height="18" rx="5"/>
    <rect x="76" y="106" width="52" height="16" rx="5"/>
  </g>

  <!-- GPS 핑 -->
  <circle cx="100" cy="92" r="30" fill="none" stroke="#9E2B1E" stroke-opacity=".14" stroke-width="2"/>
  <circle cx="100" cy="92" r="19" fill="none" stroke="#9E2B1E" stroke-opacity=".28" stroke-width="2"/>

  <!-- 접지 그림자 -->
  <ellipse cx="100" cy="92" rx="11" ry="4" fill="#2A1512" opacity=".22"/>

  <!-- 마커 (QuestMarker와 동일 기하: 물방울) -->
  <path d="M100 36c-10.5 0-19 8.5-19 19 0 13.5 19 34 19 34s19-20.5 19-34c0-10.5-8.5-19-19-19z" fill="url(#lpPin)"/>
  <path d="M100 36c-10.5 0-19 8.5-19 19 0 2 .4 4 1.1 6C84 51 91.3 45 100 45s16 6 17.9 16c.7-2 1.1-4 1.1-6 0-10.5-8.5-19-19-19z" fill="#FFFFFF" opacity=".2"/>
  <circle cx="100" cy="55" r="7.5" fill="#FFF6F3"/>
</svg>
