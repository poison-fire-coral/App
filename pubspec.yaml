name: local_quest
description: "로컬 퀘스트 — 걸어서 닿는 곳에서 시작하는 장소 기반 퀘스트 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  kakao_flutter_sdk_user: ^1.9.0
  google_sign_in: ^6.2.1
  firebase_core: ^4.13.0
  kakao_map_plugin: ^0.3.0
  geolocator: ^12.0.0
  # 지도 위 "내가 보는 방향" 표시용 자기 나침반.
  # flutter_compass 계열은 라이브러리 매니페스트에 package= 속성과 lintOptions가
  # 남아 있어 이 프로젝트의 AGP 9에서 빌드가 깨진다. 자기계·가속도계를 직접 받아
  # 방위각을 계산한다 (services/compass_service.dart).
  sensors_plus: ^7.1.0
  http: ^1.6.0
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^11.0.0
  uuid: ^4.6.0
  image_picker: ^1.2.3
  firebase_messaging: ^16.6.0

  # 설정 화면의 버전 표시. 상수로 적어 두면 pubspec 과 어긋나는데,
  # 실제로 0.1.0 이라 적혀 있는 동안 pubspec 은 1.0.0 이었다.
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/avatars/
    - assets/illustrations/
    - assets/brand/
    - assets/badges/
    - assets/markers/

  # 디자인 시스템 v1.0 (Parchment & Seal) 05 타이포 — Pretendard 400/500/600/700
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700